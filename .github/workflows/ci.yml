# Fast CI: install → version check → bundle → mock-based smoke.
#
# Deliberately NO harness code here: @deepseek-ai/* peers are resolved on
# dev machines via scripts/link-harness-deps.mjs ($DSH_HOME fallback or a
# sibling harness checkout), which a throwaway CI runner does not have.
# Two consequences, both by design:
#   - tsc --noEmit against real dsh types runs in the weekly "dsh alignment"
#     workflow (.github/workflows/align.yml) instead.
#   - smoke-host self-skips without the host runtime deps (yaml +
#     @deepseek-ai/dsh-llm + @deepseek-ai/schemastery are bare imports of the
#     built lib/index.js); the SKIP marker keeps the gate explicit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Version consistency (package.json vs README/DESIGN)
        run: pnpm run check:version

      - name: Build (icon + dual-face bundle)
        run: pnpm run bundle

      - name: Smoke (client / apply; host self-skips without harness deps)
        run: pnpm run smoke:ci
